env: "gymma"

env_args:
  key: null
  time_limit: 500
  state_repre_flag: "onehot"  # new
  pretrained_wrapper: null
  use_lare_path: False
  use_lare_path_training: False
  use_pretrained_lare_path: False
  pretrained_lare_path_model_name: "FT_QMIX_PATH_Safe_map_8x5_2agents_10.0M_Safe_map_aoba00_2agents_5.0M_checkpoint"
  use_finetuning_lare_path: False
  finetuning_lare_path_model_name: "Safe_QMIX_PATH_map_8x5_2agents_6.7M_checkpoint.pth"
  allow_reassign_before_pickup: False
  task_arrival: "fixed"
  task_density: 0.3
  # MMPP のパラメータ。randomize_task_arrival=True で mmpp が引かれたときも
  # この値が使われる (env 側で上書きしない) ので、train.py から制御できる。
  # 既定は学習範囲 U(rand_p_min, rand_p_max) の両端を往復する設定。
  task_p_high: 0.10
  task_p_low: 0.01
  task_switch_prob: 0.01   # 相転換 5 回/ep (= 5 / time_limit=500)
  # --- タスク到着プロセスのランダム化 (学習時に True にする) ---
  # True にするとエピソード毎に bernoulli(p ランダム) / mmpp を引き直す。
  # 上の task_arrival / task_density は初期値としてしか使われなくなる。
  # 1 つの方策を全シナリオで評価するために必要 (design/training_plan.md §0)。
  randomize_task_arrival: False
  mmpp_ratio: 0.5          # MMPP を引く確率。残りが bernoulli (MMPP 内部の値は固定)
  # 全マップ共通。マップで 1 タスクの所要ステップが 3.2 倍違うが、この範囲なら
  # どのマップも疎〜密を経験する (map_8x5: 0.32〜3.2 件/サイクル、aoba00: 1.0〜10.3)。
  rand_p_min: 0.01         # bernoulli p の下限
  rand_p_max: 0.10         # bernoulli p の上限
  # 評価用のエピソード単位 seed。学習では多様性が失われるので null のままにする。
  episode_seed_base: null
  use_dynamic_agents: False
  randomize_initial_active: False
  min_active_agents: 2
  max_active_agents: null
  initial_active_num: null

test_greedy: True
test_nepisode: 100
test_interval: 50000
log_interval: 50000
runner_log_interval: 10000
learner_log_interval: 10000
t_max: 80050000